<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06140f" />
      <stop offset="100%" stop-color="#0d291e" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgLoop)" />

  <!-- Bioluminescent Mycelium Network Connecting Nodes -->
  <g stroke="#10b981" stroke-width="2.5" fill="none">
    <path d="M 170 225 Q 285 120 400 225 T 630 225" />
    <path d="M 170 225 Q 285 330 400 225 T 630 225" stroke="#34d399" stroke-dasharray="6 6" />
  </g>

  <!-- Node 1: /compact Context Pruning -->
  <g transform="translate(80, 155)">
    <rect width="180" height="140" rx="18" fill="#0b2219" stroke="#34d399" stroke-width="2" />
    <circle cx="90" cy="42" r="20" fill="#064e3b" stroke="#6ee7b7" stroke-width="1.5" />
    <text x="90" y="47" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">-75%</text>
    <text x="90" y="85" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">/compact Pruning</text>
    <text x="90" y="108" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">Zero Waste Tokens</text>
  </g>

  <!-- Node 2: 127.0.0.1 Loopback -->
  <g transform="translate(310, 155)">
    <rect width="180" height="140" rx="18" fill="#0b2219" stroke="#fbbf24" stroke-width="2" />
    <circle cx="90" cy="42" r="20" fill="#451a03" stroke="#fde68a" stroke-width="1.5" />
    <text x="90" y="47" fill="#fde68a" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">0ms</text>
    <text x="90" y="85" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Local Loopback</text>
    <text x="90" y="108" fill="#fde68a" font-family="monospace" font-size="11" text-anchor="middle">127.0.0.1:4000</text>
  </g>

  <!-- Node 3: Zero Carbon & ₹0 Output -->
  <g transform="translate(540, 155)">
    <rect width="180" height="140" rx="18" fill="#0b2219" stroke="#10b981" stroke-width="2" />
    <circle cx="90" cy="42" r="20" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="90" y="47" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">$0</text>
    <text x="90" y="85" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Green Autonomy</text>
    <text x="90" y="108" fill="#6ee7b7" font-family="monospace" font-size="11" text-anchor="middle">Clean &amp; Sustainable</text>
  </g>
</svg>
