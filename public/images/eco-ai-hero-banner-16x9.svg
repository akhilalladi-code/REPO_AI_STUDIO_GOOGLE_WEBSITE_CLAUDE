<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d08" />
      <stop offset="40%" stop-color="#071c14" />
      <stop offset="80%" stop-color="#0d2b1f" />
      <stop offset="100%" stop-color="#05140d" />
    </linearGradient>

    <radialGradient id="solarGlow" cx="80%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.38" />
      <stop offset="25%" stop-color="#34d399" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020d08" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#047857" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020d08" stop-opacity="0" />
    </radialGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="lushLeaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="lushLeaf2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="solarLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Silicon Chip Gradients -->
    <linearGradient id="chipSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="50%" stop-color="#081812" />
      <stop offset="100%" stop-color="#040d09" />
    </linearGradient>

    <linearGradient id="goldTraces" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="bioGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.08" />
    </linearGradient>

    <!-- Sun Ray Angle -->
    <linearGradient id="sunBeam" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020d08" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Bioluminescent Bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base 16:9 Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />
  <rect width="1600" height="900" fill="url(#solarGlow)" />

  <!-- Diagonal Golden Sunlight Streams -->
  <polygon points="1200,0 1520,0 950,900 600,900" fill="url(#sunBeam)" opacity="0.8" />
  <polygon points="980,0 1180,0 620,900 420,900" fill="url(#sunBeam)" opacity="0.5" />
  <polygon points="1350,0 1600,0 1200,900 950,900" fill="url(#sunBeam)" opacity="0.6" />

  <!-- Solarpunk Architectural Geodesic Canopy Arches -->
  <g stroke="#34d399" stroke-opacity="0.16" stroke-width="2" fill="none">
    <path d="M 100 900 L 100 280 Q 800 -40 1500 280 L 1500 900" />
    <path d="M 220 900 L 220 340 Q 800 50 1380 340 L 1380 900" />
    <line x1="800" y1="110" x2="800" y2="900" />
    <line x1="100" y1="420" x2="1500" y2="420" />
    <line x1="100" y1="620" x2="1500" y2="620" />
    <!-- Hexagonal greenhouse joints -->
    <circle cx="800" cy="110" r="8" fill="#34d399" fill-opacity="0.3" />
    <circle cx="480" cy="220" r="6" fill="#34d399" fill-opacity="0.3" />
    <circle cx="1120" cy="220" r="6" fill="#34d399" fill-opacity="0.3" />
    <circle cx="220" cy="420" r="6" fill="#34d399" fill-opacity="0.3" />
    <circle cx="1380" cy="420" r="6" fill="#34d399" fill-opacity="0.3" />
  </g>

  <!-- Distant Layered Botanical Hills & Terraces -->
  <path d="M 0 720 Q 350 630 800 680 T 1600 650 L 1600 900 L 0 900 Z" fill="#041a12" opacity="0.9" />
  <path d="M 0 770 Q 500 690 1000 750 T 1600 730 L 1600 900 L 0 900 Z" fill="#072419" />
  <path d="M 0 830 Q 400 780 850 820 T 1600 800 L 1600 900 L 0 900 Z" fill="#0b2e20" />

  <!-- Bioluminescent Fiber-Optic Root Systems (Intertwining Hardware & Nature) -->
  <g stroke="#34d399" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75" filter="url(#bloom)">
    <!-- Main bus roots -->
    <path d="M 800 580 C 700 660, 520 710, 240 860" stroke-dasharray="6 4" />
    <path d="M 800 580 C 900 660, 1080 710, 1360 860" stroke-dasharray="6 4" />
    <path d="M 800 580 C 780 680, 810 770, 800 900" />
    <path d="M 620 630 C 480 690, 360 760, 150 900" stroke-dasharray="8 6" stroke="#6ee7b7" />
    <path d="M 980 630 C 1120 690, 1240 760, 1450 900" stroke-dasharray="8 6" stroke="#6ee7b7" />

    <!-- Data Node Pulses -->
    <circle cx="520" cy="710" r="6" fill="#fde68a" />
    <circle cx="1080" cy="710" r="6" fill="#fde68a" />
    <circle cx="380" cy="790" r="5" fill="#6ee7b7" />
    <circle cx="1220" cy="790" r="5" fill="#6ee7b7" />
    <circle cx="800" cy="730" r="7" fill="#34d399" />
  </g>

  <!-- Left Foreground Lush Foliage (Monsteras, Ferns, Solar Fronds) -->
  <g>
    <!-- Big Palm/Monstera Fronds -->
    <path d="M -40 720 Q 180 500 380 560 Q 240 730 -40 720 Z" fill="url(#lushLeaf1)" opacity="0.95" />
    <path d="M -20 520 Q 200 320 420 390 Q 260 580 -20 520 Z" fill="url(#lushLeaf2)" opacity="0.9" />
    <path d="M 40 860 Q 220 640 450 710 Q 280 870 40 860 Z" fill="#047857" />
    <path d="M -60 360 Q 140 180 340 240 Q 200 420 -60 360 Z" fill="url(#solarLeaf)" opacity="0.85" />

    <!-- Leaf Vein Circuitry (Gold & Emerald Traces) -->
    <path d="M -10 515 Q 180 400 390 385" stroke="#a7f3d0" stroke-width="2.5" fill="none" opacity="0.75" />
    <path d="M 120 460 Q 160 410 240 375" stroke="#fde68a" stroke-width="1.8" fill="none" opacity="0.6" />
    <path d="M 210 495 Q 260 450 330 420" stroke="#fde68a" stroke-width="1.8" fill="none" opacity="0.6" />

    <path d="M -30 710 Q 160 580 350 555" stroke="#a7f3d0" stroke-width="2.5" fill="none" opacity="0.75" />
    <path d="M 100 655 Q 150 610 220 585" stroke="#6ee7b7" stroke-width="1.8" fill="none" opacity="0.6" />
  </g>

  <!-- Right Foreground Botanical Growth & Sprouting Ferns -->
  <g>
    <path d="M 1640 680 Q 1420 460 1220 520 Q 1360 690 1640 680 Z" fill="url(#lushLeaf1)" opacity="0.95" />
    <path d="M 1620 480 Q 1400 280 1180 350 Q 1340 540 1620 480 Z" fill="url(#lushLeaf2)" opacity="0.9" />
    <path d="M 1560 840 Q 1380 620 1150 690 Q 1320 850 1560 840 Z" fill="#065f46" />
    <path d="M 1660 330 Q 1460 150 1260 210 Q 1400 390 1660 330 Z" fill="url(#solarLeaf)" opacity="0.85" />

    <!-- Vein Traces -->
    <path d="M 1610 475 Q 1420 360 1210 345" stroke="#fde68a" stroke-width="2.5" fill="none" opacity="0.75" />
    <path d="M 1480 420 Q 1440 370 1360 335" stroke="#a7f3d0" stroke-width="1.8" fill="none" opacity="0.6" />
    <path d="M 1390 455 Q 1340 410 1270 380" stroke="#a7f3d0" stroke-width="1.8" fill="none" opacity="0.6" />
  </g>

  <!-- ====================================================================== -->
  <!-- CENTERPIECE: Low-Power Open-Source Neural Processor nestled in nature   -->
  <!-- ====================================================================== -->
  <g transform="translate(470, 160)">
    <!-- Radial aura around processor -->
    <circle cx="330" cy="220" r="280" fill="url(#coreGlow)" />

    <!-- External Living Vine Tendrils Wrapped Around Heat Spreader -->
    <g stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M -30 380 C 40 360, 80 410, 120 425 C 160 440, 210 405, 230 435" />
      <path d="M 690 380 C 620 360, 580 410, 540 425 C 500 440, 450 405, 430 435" />
      <!-- Small sprouting leaves on vines -->
      <path d="M 85 410 Q 100 380 120 395 Q 105 420 85 410 Z" fill="#34d399" stroke="none" />
      <path d="M 575 410 Q 560 380 540 395 Q 555 420 575 410 Z" fill="#34d399" stroke="none" />
      <path d="M 190 415 Q 215 390 230 410 Q 205 430 190 415 Z" fill="#fde68a" stroke="none" />
    </g>

    <!-- Outer Carrier Socket / PCB Bed (Verdant Dark Substrate) -->
    <rect x="0" y="0" width="660" height="440" rx="32" fill="#04120c" stroke="#10b981" stroke-width="3" />
    <rect x="12" y="12" width="636" height="416" rx="24" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="12 8" />

    <!-- Gold Pin Grid Array Traces on Sides -->
    <g stroke="url(#goldTraces)" stroke-width="2" opacity="0.85">
      <!-- Top pins -->
      <line x1="80" y1="0" x2="80" y2="28" /><line x1="120" y1="0" x2="120" y2="28" />
      <line x1="160" y1="0" x2="160" y2="28" /><line x1="200" y1="0" x2="200" y2="28" />
      <line x1="460" y1="0" x2="460" y2="28" /><line x1="500" y1="0" x2="500" y2="28" />
      <line x1="540" y1="0" x2="540" y2="28" /><line x1="580" y1="0" x2="580" y2="28" />
      <!-- Bottom pins -->
      <line x1="80" y1="412" x2="80" y2="440" /><line x1="120" y1="412" x2="120" y2="440" />
      <line x1="160" y1="412" x2="160" y2="440" /><line x1="200" y1="412" x2="200" y2="440" />
      <line x1="460" y1="412" x2="460" y2="440" /><line x1="500" y1="412" x2="500" y2="440" />
      <line x1="540" y1="412" x2="540" y2="440" /><line x1="580" y1="412" x2="580" y2="440" />
    </g>

    <!-- Main Processor Heatspreader (Brushed Obsidian & Emerald Ceramic) -->
    <rect x="50" y="44" width="560" height="352" rx="20" fill="url(#chipSurface)" stroke="#059669" stroke-width="2.5" />

    <!-- Top Silicon Inscription Bar -->
    <rect x="50" y="44" width="560" height="42" rx="20" fill="#082419" />
    <circle cx="78" cy="65" r="6" fill="#34d399" />
    <circle cx="98" cy="65" r="6" fill="#fbbf24" />
    <circle cx="118" cy="65" r="6" fill="#10b981" />
    <text x="330" y="70" fill="#a7f3d0" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">
      CLAUDE CODE • ZERO-CARBON NEURAL ENGINE
    </text>

    <!-- Central Silicon Die Window (Glassmorphic Bio-Circuit Core) -->
    <g transform="translate(100, 110)">
      <!-- Die Bed -->
      <rect x="0" y="0" width="460" height="210" rx="14" fill="#030b07" stroke="#34d399" stroke-width="1.8" />

      <!-- Internal Bio-Silicon Neural Network Pathways -->
      <g stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.6">
        <path d="M 30 30 L 110 30 L 150 70 L 230 70" />
        <path d="M 30 180 L 110 180 L 150 140 L 230 140" />
        <path d="M 430 30 L 350 30 L 310 70 L 230 70" />
        <path d="M 430 180 L 350 180 L 310 140 L 230 140" />
        <circle cx="150" cy="70" r="4" fill="#fde68a" />
        <circle cx="150" cy="140" r="4" fill="#fde68a" />
        <circle cx="310" cy="70" r="4" fill="#fde68a" />
        <circle cx="310" cy="140" r="4" fill="#fde68a" />
      </g>

      <!-- Center Hex Core: The Open Intelligence Heart -->
      <g transform="translate(180, 55)">
        <polygon points="50,0 100,28 100,72 50,100 0,72 0,28" fill="#093122" stroke="#6ee7b7" stroke-width="2.5" />
        <polygon points="50,12 88,34 88,66 50,88 12,66 12,34" fill="#051c14" stroke="#fde68a" stroke-width="1.5" />

        <!-- Open Source Hardware & Zero Logo Symbol -->
        <text x="50" y="58" fill="#fde68a" font-family="system-ui, sans-serif" font-size="28" font-weight="900" text-anchor="middle">
          ₹0
        </text>
      </g>

      <!-- Live Terminal / Telemetry Streams Inside Chip -->
      <g font-family="monospace" font-size="11" fill="#6ee7b7">
        <text x="24" y="90">$ loopback: 127.0.0.1:4000</text>
        <text x="24" y="112" fill="#94a3b8">&gt; Power: 0.0W idle</text>
        <text x="24" y="134" fill="#34d399">&gt; Invariant: ₹0.00 / mo</text>

        <text x="310" y="90" text-anchor="start" fill="#fde68a">Model: gemini-2.5-flash</text>
        <text x="310" y="112" text-anchor="start" fill="#94a3b8">Context: 1M Tokens</text>
        <text x="310" y="134" text-anchor="start" fill="#6ee7b7">Hardware: 0g E-Waste</text>
      </g>
    </g>

    <!-- Bottom Metrics Strip on Heatspreader -->
    <g transform="translate(90, 335)" font-family="monospace" font-size="11">
      <rect x="0" y="0" width="480" height="40" rx="10" fill="#05170f" stroke="#065f46" stroke-width="1.2" />

      <circle cx="20" cy="20" r="4" fill="#34d399" />
      <text x="32" y="24" fill="#a7f3d0" font-weight="bold">EFFICIENCY:</text>
      <text x="110" y="24" fill="#6ee7b7">100% Local / Free Tier</text>

      <line x1="240" y1="8" x2="240" y2="32" stroke="#065f46" stroke-width="1.5" />

      <circle cx="260" cy="20" r="4" fill="#fbbf24" />
      <text x="272" y="24" fill="#fde68a" font-weight="bold">AUDIT:</text>
      <text x="325" y="24" fill="#fde68a">1,500 RPD • ₹0 Perpetuity</text>
    </g>

    <!-- Fresh Sprouting Leaf Growing from the Top Right of the Chip -->
    <g transform="translate(580, 20)">
      <path d="M 0 30 Q 30 -10 65 10 Q 35 45 0 30 Z" fill="url(#solarLeaf)" />
      <path d="M 0 30 Q 15 -25 -10 -35 Q -25 0 0 30 Z" fill="url(#lushLeaf1)" />
      <circle cx="65" cy="10" r="3" fill="#fef08a" />
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- FLOATING SUSTAINABLE BADGES (High-craft solarpunk HUD cards)          -->
  <!-- ====================================================================== -->

  <!-- Top-Left Badge: Zero Carbon & Low Wattage -->
  <g transform="translate(80, 110)">
    <rect width="320" height="74" rx="18" fill="#04140d" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <circle cx="36" cy="37" r="18" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="36" y="43" fill="#6ee7b7" font-size="18" text-anchor="middle">🌱</text>
    <text x="68" y="30" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
      Zero Carbon Loopback
    </text>
    <text x="68" y="50" fill="#94a3b8" font-family="monospace" font-size="11">
      0g E-Waste • Repurposed Tech
    </text>
  </g>

  <!-- Bottom-Left Badge: Local Quantization & Airgap Privacy -->
  <g transform="translate(80, 710)">
    <rect width="340" height="74" rx="18" fill="#04140d" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <circle cx="36" cy="37" r="18" fill="#064e3b" stroke="#fbbf24" stroke-width="1.5" />
    <text x="36" y="43" fill="#fbbf24" font-size="18" text-anchor="middle">⚡</text>
    <text x="68" y="30" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
      Ollama 64K &amp; LiteLLM
    </text>
    <text x="68" y="50" fill="#94a3b8" font-family="monospace" font-size="11">
      Airgapped Private Offline Inferences
    </text>
  </g>

  <!-- Top-Right Badge: Perpetual ₹0 Cost Guarantee -->
  <g transform="translate(1200, 110)">
    <rect width="320" height="74" rx="18" fill="#04140d" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <circle cx="36" cy="37" r="18" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="36" y="43" fill="#6ee7b7" font-size="18" text-anchor="middle">♾️</text>
    <text x="68" y="30" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
      Perpetual ₹0.00 / Month
    </text>
    <text x="68" y="50" fill="#94a3b8" font-family="monospace" font-size="11">
      Zero Credit Card Requirement
    </text>
  </g>

  <!-- Bottom-Right Badge: Cross-Platform Universal Terminal -->
  <g transform="translate(1200, 710)">
    <rect width="320" height="74" rx="18" fill="#04140d" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <circle cx="36" cy="37" r="18" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="36" y="43" fill="#6ee7b7" font-size="18" text-anchor="middle">💻</text>
    <text x="68" y="30" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
      Universal Multi-Platform
    </text>
    <text x="68" y="50" fill="#94a3b8" font-family="monospace" font-size="11">
      Windows • Mac • Linux • Termux
    </text>
  </g>

  <!-- Bioluminescent Spores / Ambient Glowing Micro-Particles -->
  <g fill="#fde68a" opacity="0.85">
    <circle cx="280" cy="260" r="3.5" />
    <circle cx="410" cy="180" r="2.5" />
    <circle cx="1180" cy="270" r="3" />
    <circle cx="1390" cy="360" r="3.5" />
    <circle cx="750" cy="90" r="2.5" />
    <circle cx="890" cy="110" r="3" />
    <circle cx="490" cy="650" r="3.5" />
    <circle cx="1120" cy="660" r="3" />
    <circle cx="680" cy="820" r="4" fill="#6ee7b7" />
    <circle cx="940" cy="830" r="4" fill="#6ee7b7" />
  </g>
</svg>
