<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGarden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081a14" />
      <stop offset="100%" stop-color="#133326" />
    </linearGradient>
    <radialGradient id="sunWarm" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#081a14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGarden)" />
  <rect width="800" height="450" fill="url(#sunWarm)" />

  <!-- Reclaimed Natural Wood Cafe Table Surface -->
  <path d="M 0 320 L 800 280 L 800 450 L 0 450 Z" fill="#1c1917" />
  <path d="M 0 320 L 800 280 L 800 292 L 0 332 Z" fill="#292524" />

  <!-- Lush Hanging Botanical Vines -->
  <path d="M 90 0 Q 130 90 80 170 Q 40 100 90 0 Z" fill="#10b981" opacity="0.8" />
  <path d="M 150 0 Q 190 70 140 130 Q 110 70 150 0 Z" fill="#34d399" opacity="0.7" />
  <path d="M 650 0 Q 610 100 670 180 Q 710 100 650 0 Z" fill="#059669" opacity="0.85" />

  <!-- Sleek Smartphone Running Termux at 3.5 Watts -->
  <g transform="translate(230, 140) rotate(-4)">
    <rect x="0" y="0" width="190" height="240" rx="22" fill="#091510" stroke="#34d399" stroke-width="2.5" />
    <rect x="12" y="20" width="166" height="200" rx="12" fill="#050e0a" />
    <text x="24" y="48" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">termux@arm64:~$</text>
    <text x="24" y="68" fill="#e2e8f0" font-family="monospace" font-size="10">claude -p "test"</text>
    <text x="24" y="92" fill="#6ee7b7" font-family="monospace" font-size="10">✓ 3.5W Solar ARM</text>
    <text x="24" y="112" fill="#fde68a" font-family="monospace" font-size="10">✓ Cost: $0.00</text>
    <rect x="24" y="135" width="140" height="55" rx="8" fill="#0c241b" stroke="#10b981" />
    <text x="94" y="160" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">98% Less Power</text>
    <text x="94" y="176" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">vs Desktop Rig</text>
  </g>

  <!-- Steaming Clay Cup of Herbal Masala Chai -->
  <g transform="translate(490, 235)">
    <!-- Steam Wisps -->
    <path d="M 35 -15 Q 25 -40 40 -60 T 35 -95" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" />
    <path d="M 60 -10 Q 70 -35 55 -55 T 60 -90" stroke="#fde68a" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" />
    <!-- Terracotta Kulhad Cup -->
    <path d="M 15 0 L 85 0 L 75 85 Q 50 95 25 85 Z" fill="#b45309" stroke="#f59e0b" stroke-width="1.5" />
    <ellipse cx="50" cy="0" rx="35" ry="9" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <ellipse cx="50" cy="2" rx="29" ry="6" fill="#d97706" />
  </g>
</svg>
